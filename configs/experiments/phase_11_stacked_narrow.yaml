# Phase 11 reduced design (docs/logs/PHASE11_LOG.md "Reduced design, descriptive names"). Two ways to compensate a 3x3-only AlexNet:
# depth (two 3x3 per stage, same geometry as the k3x3 grid cells, x head x BN = 4) and a narrow, cheap net
# (AlexNetSmallKernel: 5 convs, 64-128-256 channels, stride 1, x head = 2).
# Same protocol as every Phase 11 run (_protocols/no_patience.yaml), enforced by tests/test_config.py. Model names:
# ml/model_registrations.py (CELL_FACTORS). Queued one job per model on PCAD (scripts/pcad/feed_queue.sh):
#   python -m scripts.cluster submit --experiment phase_11_stacked_narrow --runtime pcad --slurm tupi_4090 --model <m>
extends: _protocols/no_patience
name: phase_11_stacked_narrow
models:
  - alexnet_k3x3stacked_stride2_2pool2x2_map8_gap_bn
  - alexnet_k3x3stacked_stride2_2pool2x2_map8_fc_bn
  - alexnet_k3x3stacked_stride2_2pool2x2_map8_gap_nobn
  - alexnet_k3x3stacked_stride2_2pool2x2_map8_fc_nobn
  - alexnet_k3x3narrow_stride1_2pool2x2_map16_gap_nobn
  - alexnet_k3x3narrow_stride1_2pool2x2_map16_fc_nobn
