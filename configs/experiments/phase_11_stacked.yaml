# Phase 11 minimal design (docs/logs/PHASE11_LOG.md "Minimal design, symmetric 2x2 padding, scratch twins"). Compensating
# a small-kernel AlexNet with depth: two convs per stage instead of one, for 3x3 and 2x2, x head {GAP, FC + Dropout --
# AlexNet's own head, since 2026-10-07}, with BN (the deeper no-BN net did not train before), at the k3x3/k2x2 cells'
# geometry (stride 2, two 2x2 pools, 8x8 map) -- each paired with its one-conv-per-stage twin in phase_11_kernel_head_bn
# (figures 11, 14).
# Same protocol as every Phase 11 run (_protocols/no_patience.yaml), enforced by tests/test_config.py. Model names:
# ml/model_registrations.py (CELL_FACTORS). Queued one job per model on PCAD (scripts/pcad/feed_queue.sh):
#   python -m scripts.cluster submit --experiment phase_11_stacked --runtime pcad --slurm tupi_beagle --model <m>
extends: _protocols/no_patience
name: phase_11_stacked
models:
  - alexnet_k3x3stacked_stride2_2pool2x2_map8_gap_bn
  - alexnet_k3x3stacked_stride2_2pool2x2_map8_fcdrop_bn
  - alexnet_k2x2stacked_stride2_2pool2x2_map8_gap_bn
  - alexnet_k2x2stacked_stride2_2pool2x2_map8_fcdrop_bn
