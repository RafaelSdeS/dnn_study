# Fase 2 do plano (Winograd-FPGA repo, docs/plano_avaliacao_redes_winograd.md,
# secao "Fase 2 -- Treinar no PCAD (FP32 -> QAT -> INT8)"): TODOS os modelos do
# zero, MESMO budget -- nao o melhor resultado por rede. Os checkpoints legados
# de BEST_MODELS.md (32-152 epocas, spread 4.75x) NAO entram nesta tabela.
#
# `uniform_hparams: true` bypassa o lr/weight_decay por-modelo de
# ml/model_registrations.py (register_model(lr=...)) -- sem isso o "mesmo lr
# para todos" do plano seria silenciosamente furado pelo default do
# scripts/train.py, que aplica o override por-modelo incondicionalmente.
#
# Os 4 modelos abaixo com sufixo _fpga (registrados em
# ml/model_registrations.py via models/wino_adapted.py) sao variantes SEPARADAS
# das arquiteturas nativas -- a nativa (ex. alexnet_stacked) tem 1 conv 3x3/s2
# que o qat_wino.convert() simplesmente IGNORA (nao lanca erro, so' deixa aquela
# camada sem a numerica do acelerador); a _fpga aplica a conversao do §4
# (3x3/s2 -> 3x3/s1+maxpool2x2) ANTES do treino FP32, entao a rede inteira
# ja' nasce elegivel. Por isso NAO estao as duas nesta lista -- treinar as duas
# dobraria o custo sem servir a este estudo (a nativa nao roda no acelerador).
name: budget_unico
uniform_hparams: true
seed: 42
models:
  - vgg_style                              # Tier A #3
  - alexnet_smallkernel                    # Tier A #8
  - alexnet_small_kernel_with_bn           # Tier A, nunca treinado antes desta run
  - alexnet_3x3_fc_fpga                    # "AlexNet original", kernel 3x3 + cabeca FC classica, conv1 convertida (stride2->stride1+pool)
  - alexnet_stacked_fpga                   # Tier A #11, convertida
  - alexnet_fire                           # Tier B #13 (sem stride-2, nao precisa de variante _fpga)
  - alexnet_fire_bypass                    # Tier B #4 (mesma geometria de conv que alexnet_fire)
  - alexnet_bottleneck_fpga                # Tier B #10, convertida
  - alexnet_final_fire_residual_fpga       # Tier B #5, convertida
  - alexnet_final_bottleneck_residual_fpga # Tier B #9, convertida
  - googlenet_fpga                         # literatura: Inception, stem 7x7->3x tres 3x3 + convs 3x3/s2 convertidas
  - resnet50_fpga                          # literatura: ResNet (bottleneck residual), idem
  - squeezenet1_1_fpga                     # literatura: Fire modules, idem
stages:
  - fp32
  - qat_wino
training:
  epochs: 100
  lr: 3.0e-4
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  grad_clip_norm: null
  use_amp: true
  early_stopping_patience: 10
qat_wino:
  epochs: 15
  lr: 5.0e-5
  weight_decay: 5.0e-4
