# Every other classification CNN of the study (Phases 1-4, 9) under the single Phase 11 protocol, so the
# report's compensation/hybrid/baseline tables share it with the kernel study. The AlexNet/VGG kernel, head, BN,
# geometry, Dropout, pretraining and stacked/narrow comparisons live in the other phase_11_*.yaml files (descriptive
# names). Left out: alexnet_se (its SE block can't convert to INT8 -- "empty_strided not supported on quantized
# tensors"), the ViTs (own recipe, Eixo 7), alexnet_2x2_fc (legacy unpadded 2x2, superseded by the k2x2 cells).
# Lowest priority of the Phase 11 queue (docs/logs/PHASE11_LOG.md "Reduced design, descriptive names").
# Same protocol as every Phase 11 run, enforced by tests/test_config.py.
# Submit (clean tree, pulled): python -m scripts.cluster submit-sweep --experiment phase_11_families --runtime pcad --slurm tupi_4090
extends: _protocols/no_patience
name: phase_11_families
models:
  - alexnet_bottleneck
  - alexnet_fire
  - alexnet_factorized
  - alexnet_groupconv
  - alexnet_depthwisesep
  - alexnet_residual
  - alexnet_dilated_fc
  - alexnet_dilated_gap
  - alexnet_small_kernel_with_bn
  - tinyhybridnet
  - tinymobilenetv2
  - alexnet_final_bottleneck_fire
  - alexnet_final_fire_residual
  - alexnet_final_bottleneck_residual
  - alexnet_final_depthwise_fire
  - alexnet_fire_bypass
  - vgg_style
  - mobilenetv2
  - resnet18tv
