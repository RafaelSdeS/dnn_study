# Phase 14 (2026-11-05, docs/logs/PHASE14_LOG.md): one arm of the Winograd-FPGA accelerator numerics, F(2,3) with
# packing (2 multiplications per DSP, the deploy bitstream's), on Phase 11's one recipe. Replaces wino_f23_pack (15 epochs at
# lr 5e-5 on budget_unico's AdamW FP32, measured on the validation split).
# qat_wino here IS the recipe's QAT (_protocols/no_patience.yaml, Wu et al. 2020 App. A.2): 50 epochs, the same SGD,
# lr 1e-4 cosine down to 1e-6; evaluated on the held-out test set like every other stage. (u_w, v_w) = (9, 8) is the
# iso-DSP-budget point of all three arms: u_w + 2*v_w <= 25 for K=2 on a DSP48E2 (wino_f43_pack.yaml).
# Only the qat_wino stage: the FP32 is reused, so the three arms differ in the numerics alone. Before submitting a net,
# copy its finished FP32 run into this experiment (the qat_wino-only path reads it, f87b6a7) -- on PCAD, from ~/dnn_study:
#   m=<model>; src=outputs/pcad/phase_14_winograd_fp32/$m   # the two Phase 11 cells: phase_11_dropout_pretraining/$m,
#   dst=outputs/pcad/phase_14_winograd_f23_pack/$m           #   phase_11_vgg_kernel_head/$m
#   mkdir -p $dst/checkpoints $dst/results && cp -n $src/checkpoints/${m}_best.pth $dst/checkpoints/ \
#     && cp -n $src/results/${m}_fp32_{val,test}_logits.npz $src/results/${m}_summary.json $dst/results/
# Submit with WINOGRAD_FPGA_ROOT=~/winograd_bridge_m7/avaliacao_redes (bridge f44da9a; ~/winograd_bridge has no packing).
extends: _protocols/no_patience
name: phase_14_winograd_f23_pack
stages:
  - qat_wino
qat_wino:
  epochs: 50
  lr: 1.0e-4
  eta_min: 1.0e-6
  weight_decay: 5.0e-4
  variant: f23
  pack: true
  u_w: 9
  v_w: 8
  k_dsp: 2
models:
  # the 14 nets of phase_14_winograd_fp32
  - vgg_style_fpga
  - alexnet_stacked_fpga
  - repvgg_a0_fpga
  - vgg13_fpga
  - alexnet_3x3_fc_fpga
  - alexnet_fire_fpga
  - alexnet_fire_bypass_fpga
  - alexnet_bottleneck_fpga
  - alexnet_final_fire_residual_fpga
  - alexnet_final_bottleneck_residual_fpga
  - googlenet_fpga
  - resnet18_fpga
  - wrn_16_4_fpga
  - wrn_28_2_fpga
  # Phase 11's one-recipe twins of the old arms' alexnet_tv_3x3 and vgg16 (FP32 already trained there)
  - alexnet_k3x3_stride4_3pool3x3_map1_fcdrop_nobn
  - vgg16_k3x3_stride1_5pool2x2_map2_fcdrop_bn
