# Winograd-eligible 3x3 conv-stem attention models (H5 follow-up to ideas/PHASE8_PLAN.md).
# Separate from configs/experiments/phase8.yaml on purpose: that file's other 5 models are
# already fully trained, and re-running --experiment phase8 to add these two would touch
# their checkpoints/scheduler state too. vit_tiny_convstem/swin_pico_convstem needs neither, so both
# go through this generic CLI loop, no notebook.
name: phase8_convstem
models:
  - vit_tiny_convstem
  - swin_pico_convstem
seed: 42
stages:
  - fp32
  - qat
  - int8
data:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  train_val_split: 0.9
training:
  epochs: 1000
  lr: 5.0e-4
  weight_decay: 0.05
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  use_amp: true
  early_stopping_patience: 50
  warmup_epochs: 5
qat:
  epochs: 100
  lr: 1.0e-5
  weight_decay: 5.0e-4
  freeze_bn_epoch: 3
  disable_observer_epoch: 5
