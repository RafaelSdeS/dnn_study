name: large_scale
models:
  - alexnet_tv
  - vgg_style
  - mobilenetv2
  - resnet18tv
  - alexnet_bottleneck
  - alexnet_depthwisesep
  - alexnet_fire
  - alexnet_smallkernel
  - alexnet_final_bottleneck_residual
  - alexnet_final_fire_residual
  - alexnet_final_bottleneck_fire
  - alexnet_final_depthwise_fire
seed: 42
stages:
  - fp32
  - qat
  - int8
# Protocolo compartilhado "large_scale" (1000ep/patience 50, QAT 100ep) — mantido
# idêntico entre large_scale.yaml / alexnet_dilated_gap.yaml /
# phase_9_bypass_ablation_large_scale.yaml / large_scale_fire_residual_resume.yaml
# de propósito. Não existe include entre arquivos de config — mudou aqui, muda
# nos outros três.
training:
  epochs: 1000
  early_stopping_patience: 50
qat:
  epochs: 100
