# Phase 11 VGG factorial, wave 1 (docs/logs/PHASE11_LOG.md "VGG factorial"): the four factors ranked first, fully
# crossed -- kernel {3x3, 2x2, alt32 = 3,2,3,2...} x stem stride {1, 2} x pool count {5, 4} x head {FC, GAP}, MaxPool 2x2,
# no Dropout = 24 cells; + the other three mixed patterns {alt23, early3, early2} at VGG's own geometry x {FC, GAP} = 6;
# + 2 ImageNet-pretrained (vgg16_bn) cells, each with a from-scratch twin: k3_s1_pk2n5_fc_d_pt <-> vgg16
# (phase_11_kernel_size_comparison, the k3_s1_pk2n5_fc_d cell -- ml/model_registrations.py:VGG_FX_EXISTING) and
# k3_s1_pk2n5_gap_pt <-> k3_s1_pk2n5_gap below. The other cells (pool kernel 3, Dropout, the mixed patterns at the
# other geometries, more pretraining) are registered for a later wave. Same protocol as every Phase 11 run
# (_protocols/no_patience.yaml), enforced by tests/test_config.py.
# Queued one job per model on PCAD (scripts/pcad/feed_queue.sh), after the AlexNet wave-1 cells:
#   python -m scripts.cluster submit --experiment phase_11_vgg_factorial --runtime pcad --slurm tupi_4090 --model <m>
extends: _protocols/no_patience
