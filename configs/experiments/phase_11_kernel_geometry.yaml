# Phase 11 reduced design (docs/logs/PHASE11_LOG.md "Reduced design, descriptive names"). Does the kernel effect depend on how the net
# downsamples? The 4 kernels x head {GAP, FC} x the other 3 geometries of conv1 stride {2, 4} x pooling {two 2x2,
# three 3x3}, no BN = 24 (stride 2 + two 2x2 is phase_11_kernel_head_bn). Stride 4 + three 3x3 is torchvision's AlexNet
# layout (1x1 map at 64px); a 2x2 kernel at stride 4 reads only 25% of the pixels -- the kernel x stride interaction.
# Same protocol as every Phase 11 run (_protocols/no_patience.yaml), enforced by tests/test_config.py. Model names:
# ml/model_registrations.py (CELL_FACTORS). Queued one job per model on PCAD (scripts/pcad/feed_queue.sh):
#   python -m scripts.cluster submit --experiment phase_11_kernel_geometry --runtime pcad --slurm tupi_4090 --model <m>
extends: _protocols/no_patience
name: phase_11_kernel_geometry
models:
