# The Phase 11 protocol -- every phase_11_*.yaml extends it, and tests/test_config.py fails any that drifts. Every
# model from scratch on the same fixed budget (no early stopping: epochs_used == epochs_budget for every run), the
# same recipe for all (uniform_hparams bypasses the registry's per-model lr), every value from a reference
# (docs/logs/PHASE11_LOG.md, "One recipe, every number from a reference", 2026-10-03):
#   optimizer  SGD, momentum 0.9, lr 0.01, L2 weight decay 5e-4, batch 128 -- AlexNet's own recipe (Krizhevsky et al.,
#              NeurIPS 2012); VGG keeps all of it but the batch, 256 (Simonyan & Zisserman, ICLR 2015)
#   schedule   cosine annealing to 0 (Loshchilov & Hutter, ICLR 2017) in place of AlexNet's /10 on plateau; no warmup,
#              like AlexNet at this lr/batch (warmup is for large-minibatch lr scaling, Goyal et al. 2017); a fixed
#              budget with the LR decayed to zero (Li, Yumer & Ramanan, ICLR 2020). 500 epochs = 352k iterations at batch 128: between CIFAR's
#              long schedules (WRN 200 ep ~78k, DenseNet 300 ep ~234k) and ImageNet's (ResNet 600k at batch 256,
#              AlexNet ~840k at batch 128); per-run convergence: scripts/phase11/analyze_geometry.py convergence()
#   data       4-px pad + random crop + flip (He et al., CVPR 2016), AutoAugment ImageNet policy (Cubuk et al., CVPR 2019)
#   init       He et al. (ICCV 2015) in every from-scratch model (models/baselines.py:he_init)
#   loss       label smoothing 0.1 (Szegedy et al., CVPR 2016), configs/training.yaml; mixed-precision training,
#              FP32 evaluation (Micikevicius et al., ICLR 2018)
#   QAT        Wu et al. 2020 App. A.2 ("around 1/10th of the original training steps ... starts at 1/100th of the
#              initial value ... decayed down to 1/100th of the initial fine-tuning learning rate", cosine, only the lr
#              and its schedule change): 50 ep, lr 1e-4 -> 1e-6, same SGD; BN stats frozen after epoch 3 (qat.yaml),
#              observers after epoch 4 -- torchvision's references/classification/train_quantization.py defaults
# The QAT stage inherits early_stopping_patience and the optimizer from `training:` (scripts/train.py builds its config
# with replace()).
seed: 42
uniform_hparams: true
stages:
  - fp32
  - qat
  - int8
data:
  batch_size: 128
  train_aug: crop_flip_autoaug
training:
  epochs: 500
  early_stopping_patience: null
  optimizer: sgd
  momentum: 0.9
  lr: 0.01
  weight_decay: 5.0e-4
qat:
  epochs: 50
  lr: 1.0e-4
  eta_min: 1.0e-6
  weight_decay: 5.0e-4
  disable_observer_epoch: 4
