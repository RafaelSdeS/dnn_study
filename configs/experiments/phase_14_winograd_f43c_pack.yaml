# Phase 14 (2026-11-16, docs/logs/PHASE14_LOG.md): phase_14_winograd_f43_pack with the synthesized netlist's CALIBRATED scales
# (hw_params: f43v3 = the bridge's gate_flags/params_f43v3.txt, Thomas's F(4,3) synthesis with the scale constants
# calibrated on 2026-10-26, the f43 twin of f63c: `su`/`sv` and `align_base` 9 fixed by the netlist instead of the
# layer's analytic worst case). The article's future work "treinar as escalas calibradas do circuito em F(4,3)": the
# analytic F(4,3) arm costs ~6 pp (median), F(6,3) went from 0.56 % to 54.66 % on resnet18_fpga with its calibrated scales.
# Kept out of the 48-arm medians: scripts/phase14/winograd_numerics.py gives the calibrated arms their own median.
# Everything else is phase_14_winograd_f43_pack's, tests/test_config.py checks it. Before submitting a net, copy its FP32
# run in, as phase_14_winograd_f43_pack.yaml's header shows (src = phase_14_winograd_fp32/$m, or the Phase 11 cell's dir),
# with dst=outputs/pcad/phase_14_winograd_f43c_pack/$m.
# Submit with WINOGRAD_FPGA_ROOT=~/winograd_bridge_m7/avaliacao_redes (bridge f44da9a).
extends: _protocols/no_patience
name: phase_14_winograd_f43c_pack
stages:
  - qat_wino
qat_wino:
  epochs: 50
  lr: 1.0e-4
  eta_min: 1.0e-6
  weight_decay: 5.0e-4
  variant: f43
  pack: true
  u_w: 9
  v_w: 8
  k_dsp: 2
  hw_params: f43v3
models:
  # the 14 nets of phase_14_winograd_fp32
  - vgg_style_fpga
  - alexnet_stacked_fpga
  - repvgg_a0_fpga
  - vgg13_fpga
  - alexnet_3x3_fc_fpga
  - alexnet_fire_fpga
  - alexnet_fire_bypass_fpga
  - alexnet_bottleneck_fpga
  - alexnet_final_fire_residual_fpga
  - alexnet_final_bottleneck_residual_fpga
  - googlenet_fpga
  - resnet18_fpga
  - wrn_16_4_fpga
  - wrn_28_2_fpga
  # Phase 11's one-recipe twins of the old arms' alexnet_tv_3x3 and vgg16 (FP32 already trained there)
  - alexnet_k3x3_stride4_3pool3x3_map1_fcdrop_nobn
  - vgg16_k3x3_stride1_5pool2x2_map2_fcdrop_bn
