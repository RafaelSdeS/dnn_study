# research/plans/PHASE8_PLAN.md Task 6. deit_tiny is deliberately excluded from this list --
# its distillation training needs DistillationTrainer + a frozen mobilenetv2 teacher
# checkpoint, so it's driven from the Phase 8 notebook, not this generic CLI loop
# (same reasoning as every other model here needing no new script at all).
#
# vit_tiny's qat/int8 stages also stay in the notebook, not because they need any
# special handling anymore (D6, revised: swap_quantizable_mha() turned out to be
# unusable on this codebase's eager-mode prepare_qat() and was dropped from the QAT
# path -- vit_tiny/deit_tiny now use plain build_qat(), same as every other Phase 8
# model, via exclude_attention_from_qat() wired unconditionally into
# ml/quantization.py's prepare_qat_model()) -- but because vit_tiny is trained
# alongside deit_tiny in that notebook for a clean, identically-configured baseline,
# and splitting its qat/int8 stages into this CLI loop would mean two SAVE_DIR
# layouts for one model.
# Protocolo compartilhado "Phase 8 ViT" (1000ep, lr 5e-4, weight_decay 0.05,
# grad_clip_norm 1.0, patience 50, warmup 5, QAT 100ep) — mantido idêntico entre
# este arquivo e phase_8_efficient_vit_convstem.yaml de propósito.
# reset_scheduler_on_resume abaixo é específico DESTE arquivo (resume de
# checkpoints já treinados) — não faz parte do protocolo compartilhado, não vai
# para o outro arquivo.
name: phase_8_efficient_vit
models:
  - swin_pico_w2
  - swin_pico_w4
  - swin_pico_w8
  - swin_pico_poolmixer
  - hybrid_bottleneck_swin
seed: 42
stages:
  - fp32
  - qat
  - int8
training:
  epochs: 1000
  lr: 5.0e-4
  weight_decay: 0.05
  grad_clip_norm: 1.0
  early_stopping_patience: 50
  warmup_epochs: 5
  reset_scheduler_on_resume: true  # these 5 models' checkpoints were trained through a
    # complete epochs=100/qat.epochs=20 cosine schedule already (see research/logs/PHASE8_LOG.md);
    # resuming with the budget below needs a fresh schedule, not the exhausted one on disk
    # -- see ml/config.py's TrainerConfig.reset_scheduler_on_resume docstring
qat:
  epochs: 100
