# Phase 11 VGG factorial, wave 2 (docs/logs/PHASE11_LOG.md "One recipe, every number from a reference"): every
# registered vgg_fx_* cell not in phase_11_vgg_factorial.yaml (wave 1) or VGG_FX_EXISTING -- so the two files together
# are the full factorial: kernel pattern {k3, k2, alt32, alt23, early3, early2} x stem stride {1, 2} x pool kernel
# {2, 3/s2/p1} x pool count {5, 4} x head {GAP, FC, FC + Dropout 0.5}, + ImageNet (vgg16_bn) pretraining on every k3
# cell = 168. Same protocol as every Phase 11 run (_protocols/no_patience.yaml), enforced by tests/test_config.py.
# Queued one job per model on PCAD (scripts/pcad/feed_queue.sh), after wave 1:
#   python -m scripts.cluster submit --experiment phase_11_vgg_factorial_ext --runtime pcad --slurm tupi_4090 --model <m>
