# Winograd-eligible 3x3 conv-stem attention models (H5 follow-up to research/plans/PHASE8_PLAN.md).
# Separate from configs/experiments/phase_8_efficient_vit.yaml on purpose: that file's other 5 models are
# already fully trained, and re-running --experiment phase_8_efficient_vit to add these two would touch
# their checkpoints/scheduler state too. vit_tiny_convstem/swin_pico_convstem needs neither, so both
# go through this generic CLI loop, no notebook.
extends: _protocols/phase_8_vit
name: phase_8_efficient_vit_convstem
models:
  - vit_tiny_convstem
  - swin_pico_convstem
seed: 42
stages:
  - fp32
  - qat
  - int8
