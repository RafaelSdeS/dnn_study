# Phase 14 (2026-11-24, docs/logs/PHASE14_LOG.md): phase_14_winograd_f63_pack with packed F(6,3) on every second eligible
# conv only (module order, the first one included); the others go back to exact FP32 convs, the way a qat_wino model
# already keeps every non-eligible conv (ml.winograd_bridge.keep_winograd, the same swap as
# scripts/phase14/f63_collapse.py --wino-on every2). The F(6,3) probes found the analytic-scale error compounds where F(6,3)
# convs follow one another, and that every2 stops it at epoch 0 without lifting resnet18 / vgg13 off chance; this arm says
# whether the recipe's QAT then recovers them (the article's future work). Only the two nets that collapse in the f63 arm
# (0.56 / 0.48 %); also halves the number of F(6,3) convs, so it does not separate "chained" from "how many".
# Everything else is phase_14_winograd_f63_pack's, tests/test_config.py checks it. Before submitting a net, copy its FP32
# run in, as phase_14_winograd_f63_pack.yaml's header shows (src = outputs/pcad/phase_14_winograd_fp32/$m),
# with dst=outputs/pcad/phase_14_winograd_f63_every2_pack/$m.
# Submit with WINOGRAD_FPGA_ROOT=~/winograd_bridge_m7/avaliacao_redes (bridge f44da9a).
extends: _protocols/no_patience
name: phase_14_winograd_f63_every2_pack
stages:
  - qat_wino
qat_wino:
  epochs: 50
  lr: 1.0e-4
  eta_min: 1.0e-6
  weight_decay: 5.0e-4
  variant: f63
  pack: true
  u_w: 9
  v_w: 8
  k_dsp: 2
  wino_on: every2
models:
  - resnet18_fpga
  - vgg13_fpga
