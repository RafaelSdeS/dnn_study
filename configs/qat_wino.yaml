# QATWinoConfig — reuses ml/config.py's QATConfig dataclass (same fields as
# qat.yaml). freeze_bn_epoch/disable_observer_epoch are fbgemm-observer concepts
# that don't apply to the qat_wino stage (Winograd-FPGA's scripts/avaliacao_redes/
# qat_wino.py has its own act_absmax/post_shift trackers, no fbgemm observer to
# freeze) -- set past any realistic epoch budget so they're inert.
epochs: 15
lr: 5.0e-5
weight_decay: 5.0e-4
freeze_bn_epoch: 999
disable_observer_epoch: 999
# Contra QUAL acelerador se treina. Os defaults reproduzem as 14 corridas
# existentes (F(4,3), sem packing) -- e' por isso que elas saem marcadas `≠HW`
# nas tabelas: o bitstream de deploy roda com packing. Sobrescreva pelo bloco
# `qat_wino:` do YAML do experimento, nao aqui.
variant: f43        # f23 | f43 | f63
pack: false         # 2 mult/DSP com requantizacao por posicao
u_w: 9
v_w: 8
k_dsp: 2
