# Phase 4.1 — aggressive compression hyperparameters
# Loaded in notebooks/phase_4_compression_and_final_architecture/compression_phase4_1.ipynb via configs.loader.load_config

# INT4 post-training quantization (no retraining)
int4_ptq:
  calibration_samples: 512
  per_channel: true

# INT4 quantization-aware training (retrained under 4-bit fake-quant) — same recipe as
# configs/qat.yaml, pulled in via `extends:` (configs/loader.py) instead of copied, so a
# change to qat.yaml doesn't drift out of sync here.
int4_qat:
  extends: qat
  per_channel: true

# Mixed precision: top-K sensitive layers INT8, rest INT4
mixed_precision:
  extends: qat
  per_channel: true
  int8_ratio: 0.3          # fraction of quantizable layers kept at INT8
  calibration_samples: 512

# INT2 quantization-aware training (fake-quant, same recipe as int4_qat)
int2_qat:
  extends: qat
  per_channel: true

# Ternary (TWN) weight-only QAT via straight-through estimator — no observers/fusion
ternary_qat: &weight_only_qat_recipe
  epochs: 20
  lr: 1.0e-5
  weight_decay: 5.0e-4

# Binary (BWN) weight-only QAT via straight-through estimator — no observers/fusion
binary_qat:
  <<: *weight_only_qat_recipe
