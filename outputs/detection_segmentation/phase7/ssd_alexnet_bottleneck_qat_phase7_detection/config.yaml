data:
  batch_size: 16
  img_size: 512
  num_workers: 4
  pin_memory: true
  seed: 42
  voc_root: ~/.cache/torchvision/datasets
stage: qat
trainer:
  early_stopping_patience: 50
  epochs: 100
  grad_clip_norm: null
  label_smoothing: 0.1
  lr: 1.0e-05
  use_amp: false
  warmup_epochs: 2
  weight_decay: 0.0004
